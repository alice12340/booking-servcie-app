# Staging Fly app — does NOT deploy to booking-service-app (live).
# Deploy: npm run deploy:fly:staging
# One-time setup is documented in package.json script comments / team notes.

app = 'booking-service-app-staging'
primary_region = 'lax'

[build]

[env]
  PORT = '3000'
  SCOPES = ''
  # Set after creating the staging Partner app (must NOT reuse live client_id):
  #   flyctl secrets set SHOPIFY_API_KEY=... SHOPIFY_API_SECRET=... --config fly.staging.toml
  # TODO
  SHOPIFY_API_KEY = 'f7a6b29cc7b2bc55c0b0e23b01fa97db'
  SHOPIFY_APP_URL = 'https://booking-service-app-staging.fly.dev'

[processes]
  app = 'node ./dbsetup.js npm run docker-start'

[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

[deploy]
  release_command = "npx prisma migrate deploy"
