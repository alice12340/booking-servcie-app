# fly.toml app configuration file generated for booking-service-app on 2026-06-12T12:18:15+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'booking-service-app'
primary_region = 'lax'

[build]

[env]
  PORT = '3000'
  SCOPES = ''
  SHOPIFY_API_KEY = 'f7a6b29cc7b2bc55c0b0e23b01fa97db'
  SHOPIFY_APP_URL = 'https://booking-service-app.fly.dev'

[processes]
  app = 'node ./dbsetup.js npm run docker-start'

[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  #auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024

[deploy]
  release_command = "npx prisma migrate deploy"